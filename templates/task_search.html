<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeetSync — Task Search</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ececec;
            color: #1f2937;
        }

        .container { max-width: 900px; margin: auto; padding: 40px 20px; }

        .header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.2rem; margin-bottom: 6px; }
        .subtitle { color: #6b7280; font-size: 0.95rem; }

        .nav { text-align: center; margin-bottom: 30px; }
        .nav a {
            margin: 0 10px;
            color: #4C516D;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filters-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.83rem; font-weight: 600; color: #374151; }

        select, input[type="checkbox"] {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.88rem;
            background: #f9fafb;
            color: #1f2937;
        }

        .overdue-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 4px;
        }

        .overdue-group label { font-size: 0.88rem; font-weight: 600; color: #374151; }

        .btn-search {
            padding: 9px 20px;
            background: #4C516D;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-search:hover { opacity: 0.9; }

        .results-meta {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 14px;
        }

        .task-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .task-card.priority-high   { border-left: 4px solid #ef4444; }
        .task-card.priority-medium { border-left: 4px solid #f59e0b; }
        .task-card.priority-low    { border-left: 4px solid #10b981; }

        .task-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
        .task-meta  { display: flex; flex-wrap: wrap; gap: 8px; }

        .meta-item {
            font-size: 0.82rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            padding: 3px 9px;
            color: #374151;
        }

        .meta-item span { font-weight: 600; color: #4C516D; }

        .badge {
            font-size: 0.73rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .badge-high   { background: #fee2e2; color: #dc2626; }
        .badge-medium { background: #fef3c7; color: #d97706; }
        .badge-low    { background: #d1fae5; color: #059669; }

        .overdue-tag {
            font-size: 0.73rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: #fee2e2;
            color: #dc2626;
            margin-left: 6px;
        }

        .meeting-link {
            font-size: 0.78rem;
            color: #4C516D;
            text-decoration: none;
        }

        .meeting-link:hover { text-decoration: underline; }

        .empty { color: #6b7280; font-style: italic; text-align: center; padding: 40px 0; }
        .loading { text-align: center; padding: 40px 0; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MeetSync</h1>
            <p class="subtitle">Task Search</p>
        </div>

        <div class="nav">
            <a href="/">← Upload New</a>
            <a href="/history">📋 Meeting History</a>
        </div>

        <!-- Filters -->
        <div class="filters-card">
            <div class="filter-group">
                <label>Priority</label>
                <select id="filter-priority">
                    <option value="">All</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Status</label>
                <select id="filter-status">
                    <option value="">All</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="filter-group">
                <div class="overdue-group">
                    <input type="checkbox" id="filter-overdue">
                    <label for="filter-overdue">Overdue only</label>
                </div>
            </div>

            <button class="btn-search" onclick="searchTasks()">Search</button>
        </div>

        <div id="results-meta" class="results-meta"></div>
        <div id="results-list"><p class="empty">Select filters and click Search.</p></div>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];

        async function searchTasks() {
            const priority = document.getElementById("filter-priority").value;
            const status   = document.getElementById("filter-status").value;
            const overdue  = document.getElementById("filter-overdue").checked;

            let url = "/api/tasks?";
            if (priority) url += `priority=${priority}&`;
            if (status)   url += `status=${status}&`;
            if (overdue)  url += `overdue=true&`;

            document.getElementById("results-list").innerHTML = '<p class="loading">Searching...</p>';

            const res  = await fetch(url);
            const data = await res.json();

            document.getElementById("results-meta").textContent =
                `${data.count} task${data.count !== 1 ? 's' : ''} found`;

            if (data.tasks.length === 0) {
                document.getElementById("results-list").innerHTML =
                    '<p class="empty">No tasks match your filters.</p>';
                return;
            }

            document.getElementById("results-list").innerHTML = data.tasks.map(t => {
                const priority = t.priority.toLowerCase();
                const isOverdue = t.deadline_parsed &&
                    new Date(t.deadline_parsed) < new Date() &&
                    t.status !== 'completed';

                return `
                    <div class="task-card priority-${priority}">
                        <div class="task-title">
                            ${t.description}
                            <span class="badge badge-${priority}">${t.priority}</span>
                            ${isOverdue ? '<span class="overdue-tag">⚠ Overdue</span>' : ''}
                        </div>
                        <div class="task-meta">
                            <div class="meta-item"><span>Owner</span> &nbsp;${t.owner}</div>
                            <div class="meta-item"><span>Deadline</span> &nbsp;${t.deadline_raw || 'Not specified'}</div>
                            <div class="meta-item"><span>Status</span> &nbsp;${t.status}</div>
                            <div class="meta-item">
                                <span>Meeting</span> &nbsp;
                                <a href="/result/${t.meeting_id}" class="meeting-link">${t.meeting_filename}</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
