<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeetSync - Task Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #F0F2FF;
      --surface:      #FFFFFF;
      --border:       #E0E4F5;
      --border-light: #ECF0FF;
      --primary:      #4F46E5;
      --primary-2:    #7C3AED;
      --primary-light:#EEF2FF;
      --text:         #111827;
      --text-muted:   #6B7280;
      --success:      #059669;
      --warning:      #D97706;
      --danger:       #DC2626;
      --success-bg:   #ECFDF5;
      --warning-bg:   #FFFBEB;
      --danger-bg:    #FEF2F2;
      --radius:       14px;
      --radius-sm:    8px;
      --shadow:       0 4px 24px rgba(79,70,229,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 62px;
    }

    .nav-logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .nav-links { display: flex; gap: 6px; }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .page-header {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px 32px;
    }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .page-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .main { max-width: 820px; margin: 0 auto; padding: 0 24px 80px; }

    .filter-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .filter-group { display: flex; flex-direction: column; gap: 6px; }

    .filter-label {
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
      min-width: 130px;
    }

    input[type="text"]:focus, select:focus { border-color: var(--primary); }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 3px;
    }

    .toggle-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: white;
      top: 3px; left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .toggle input:checked + .toggle-slider { background: var(--primary); }
    .toggle input:checked + .toggle-slider::after { transform: translateX(18px); }

    .btn-search {
      padding: 9px 22px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Outfit', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-left: auto;
    }

    .btn-search:hover { opacity: 0.9; transform: translateY(-1px); }

    .results-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .results-meta strong { color: var(--primary); font-family: 'Outfit', sans-serif; }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: box-shadow 0.2s;
    }

    .task-item:hover { box-shadow: var(--shadow); }

    .task-num {
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      width: 24px; height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-body { flex: 1; }

    .task-title {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 9px;
      line-height: 1.4;
    }

    .task-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--border-light);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: normal;
      word-break: break-word;
    }

    .chip strong { color: var(--text); font-weight: 600; }
    .chip a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .chip a:hover { text-decoration: underline; }

    .overdue-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--danger-bg);
      color: var(--danger);
      margin-left: 8px;
    }

    .state-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      padding: 64px 24px;
    }

    .state-icon { font-size: 2rem; margin-bottom: 14px; opacity: 0.35; }

    .state-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .state-sub { font-size: 0.82rem; color: #9CA3AF; }
  </style>
</head>
<body>

  <nav>
    <span class="nav-logo">MeetSync</span>
    <div class="nav-links">
      <a href="/" class="nav-link">Upload</a>
      <a href="/history" class="nav-link">History</a>
      <a href="/tasks/search" class="nav-link active">Tasks</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-title">Task Search</div>
    <div class="page-sub">Filter and track action items across all your meetings</div>
  </div>

  <div class="main">

    <div class="filter-bar">

      <!-- Owner search -->
      <div class="filter-group">
        <span class="filter-label">Owner</span>
        <input type="text" id="filter-owner" placeholder="e.g. Sarah" />
      </div>

      <!-- Status -->
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <select id="filter-status">
          <option value="">All</option>
          <option value="open">Open</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <!-- Overdue -->
      <div class="filter-group">
        <span class="filter-label">Overdue</span>
        <div class="toggle-wrap">
          <label class="toggle" for="filter-overdue">
            <input type="checkbox" id="filter-overdue">
            <div class="toggle-slider"></div>
          </label>
          <span class="toggle-label">Overdue only</span>
        </div>
      </div>

      <button class="btn-search" onclick="searchTasks()">Search Tasks</button>
    </div>

    <div id="results-meta" class="results-meta"></div>
    <div id="results-list">
      <div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-title">Ready to search</div>
        <div class="state-sub">Set filters above and hit Search</div>
      </div>
    </div>

  </div>

  <script>
    async function searchTasks() {
      const owner  = document.getElementById('filter-owner').value.trim();
      const status = document.getElementById('filter-status').value;
      const overdue = document.getElementById('filter-overdue').checked;

      let url = '/api/tasks?';
      if (owner)  url += `owner=${encodeURIComponent(owner)}&`;
      if (status) url += `status=${status}&`;
      if (overdue) url += `overdue=true&`;

      document.getElementById('results-list').innerHTML = `
        <div class="state-box">
          <div class="state-icon">⏳</div>
          <div class="state-title">Searching…</div>
        </div>`;
      document.getElementById('results-meta').innerHTML = '';

      const res  = await fetch(url);
      const data = await res.json();

      document.getElementById('results-meta').innerHTML =
        `<strong>${data.count}</strong> task${data.count !== 1 ? 's' : ''} found`;

      if (!data.tasks || data.tasks.length === 0) {
        document.getElementById('results-list').innerHTML = `
          <div class="state-box">
            <div class="state-icon">📭</div>
            <div class="state-title">No tasks found</div>
            <div class="state-sub">Try adjusting your filters</div>
          </div>`;
        return;
      }

      document.getElementById('results-list').innerHTML = data.tasks.map((t, i) => {
        const isOverdue = t.deadline_parsed &&
          new Date(t.deadline_parsed) < new Date() &&
          t.status !== 'completed';

        return `
          <div class="task-item">
            <div class="task-num">${i + 1}</div>
            <div class="task-body">
              <div class="task-title">
                ${t.description}
                ${isOverdue ? '<span class="overdue-badge">⚠ Overdue</span>' : ''}
              </div>
              <div class="task-chips">
                <span class="chip"><strong>Owner</strong> ${t.owner}</span>
                <span class="chip"><strong>Due</strong> ${t.deadline_raw || 'Not specified'}</span>
                <span class="chip"><strong>Status</strong> ${t.status}</span>
                <span class="chip"><strong>Meeting</strong> <a href="/result/${t.meeting_id}">${t.meeting_filename}</a></span>
              </div>
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
