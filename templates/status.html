<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeetSync — Processing</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ececec;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 50px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.07);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        h2 { margin-bottom: 10px; }

        .status-text {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e5e7eb;
            border-top-color: #4C516D;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 14px 18px;
            color: #dc2626;
            font-size: 0.9rem;
            display: none;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4C516D;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h2>Processing your meeting</h2>
        <p class="status-text" id="status-text">
            Transcribing audio and extracting action items...
        </p>
        <div class="error-box" id="error-box">
            ⚠️ Processing failed. Please try again.
            <br>
            <a href="/" class="btn" style="margin-top:12px">← Upload Again</a>
        </div>
    </div>

    <script>
        const meetingId = {{ meeting_id }};
        const pollInterval = 3000;       // poll every 3 seconds
        const maxWaitTime = 300000;      // stop after 5 minutes
        const startTime = Date.now();

        async function checkStatus() {
            // Fix 4: Stop polling after maxWaitTime
            if (Date.now() - startTime > maxWaitTime) {
                document.getElementById("spinner").style.display = "none";
                document.getElementById("status-text").style.display = "none";
                document.getElementById("error-box").innerHTML = `
                    ⚠️ Processing is taking longer than expected. 
                    Please check back later or <a href="/">try uploading again</a>.
                `;
                document.getElementById("error-box").style.display = "block";
                return; // stop polling
            }

            try {
                const res = await fetch(`/status/${meetingId}`);
                const data = await res.json();

                if (data.status === "success") {
                    window.location.href = `/result/${meetingId}`;
                } else if (data.status === "failed") {
                    document.getElementById("spinner").style.display = "none";
                    document.getElementById("status-text").style.display = "none";
                    document.getElementById("error-box").style.display = "block";
                } else {
                    // Update status text to show elapsed time
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById("status-text").textContent =
                        `Transcribing audio and extracting action items... (${elapsed}s)`;
                    setTimeout(checkStatus, pollInterval);
                }
            } catch (err) {
                setTimeout(checkStatus, pollInterval);
            }
        }

        checkStatus();
    </script>
</body>
</html>
